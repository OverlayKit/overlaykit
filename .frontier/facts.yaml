# Hechos propios del proyecto: `- {id, command}`. El comando imprime el valor (medición, no declaración).
- id: main:head
  command: "git rev-parse --short origin/main"
- id: governance:plan-hash
  command: "jq -r .planHash .overlaykit/governance/plan.json | cut -c1-12"
- id: governance:profile-version
  command: "jq -r .version .overlaykit/governance/profile.json"
- id: spec-0001:acs-without-change-contract
  command: "comm -23 <(grep -ohE '\"id\": \"AC-[0-9]{3}\"' .overlaykit/governance/specifications/SPEC-0001.json | grep -oE 'AC-[0-9]{3}' | sort -u) <(grep -ohE 'AC-[0-9]{3}' .overlaykit/governance/changes/*.json | sort -u) | tr '\\n' ' '"
