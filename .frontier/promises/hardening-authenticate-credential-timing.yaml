id: hardening-authenticate-credential-timing
statement: HARDENING (low) — device-credential authenticate() always runs the verifier comparison (against a fixed dummy verifier when the credential is absent), so timing cannot distinguish an existing credentialId from an unknown one — is fixed by CHG-0074. It closes the store-lookup timing asymmetry, not full constant-time parsing.
anchors:
  - path:protocol/src/device-credential.ts
  - path:protocol/tests/device-credential.test.ts
  - path:.overlaykit/governance/changes/CHG-0074.json
requires:
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: file-contains
        ref: origin/main
        path: protocol/src/device-credential.ts
        matches: 'DUMMY_SEALED_SECRET'
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0074.json
        matches: '"status": "implemented"'
