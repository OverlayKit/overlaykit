id: hardening-authenticate-credential-timing
statement: "HARDENING (low) — Device authenticate() leaks credential-id existence via a timing side channel (absent record returns fast without a matches() call). Fix: run matches() against a fixed dummy verifier on the absent path."
anchors:
  - path:protocol/src/device-credential.ts
requires:
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: hardening-authenticate-credential-timing-fixed
  command: "grep -qiE 'dummySealed|decoyVerifier|constantTime' protocol/src/device-credential.ts"
