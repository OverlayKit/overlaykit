id: integrations-rotate-device-credentials
statement: A successor lets the owner rotate a device credential in place from the Studio Integrations UI (issue a fresh token for the same credential) and see a rotation/revocation audit trail. The rotate route exists at the server; the UI surface and the audit view do not.
anchors:
  - path:studio/src/views/IntegrationsView.vue
  - path:server/src/routes/deviceCredentials.ts
requires:
  promises:
    - integrations-lists-and-revokes-device-credentials
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: integrations-rotates-credentials
  command: "grep -qiE 'rotate' studio/src/views/IntegrationsView.vue"
