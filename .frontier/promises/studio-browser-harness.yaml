id: studio-browser-harness
statement: Studio has a browser-driven end-to-end harness (the tier SPEC-0001 demands), established on the first-run and authentication arc by CHG-0049.
anchors:
  - path:.overlaykit/governance/specifications/SPEC-0001.json
  - path:server/tests/e2e/studioAuthFlow.test.ts
  - path:.overlaykit/governance/changes/CHG-0049.json
requires:
  promises: []
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/tests/e2e/studioAuthFlow.test.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0049.json
        matches: '"status": "implemented"'
