id: hardening-signing-key-file-perms
statement: HARDENING (medium) — the device signing DB file (Ed25519 private key + sealed verifiers) and its directory are restricted to owner-only from creation, before any secret is written and even if init fails, closing the world-readable window — is fixed by CHG-0068. Protection is POSIX permissions only (no-op on Windows), not encryption.
anchors:
  - path:server/src/auth/SqliteDeviceCredentialStore.ts
  - path:server/tests/unit/deviceCredentialStorePermissions.test.ts
  - path:.overlaykit/governance/changes/CHG-0068.json
requires:
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/tests/unit/deviceCredentialStorePermissions.test.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0068.json
        matches: '"status": "implemented"'
