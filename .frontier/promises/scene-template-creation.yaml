id: scene-template-creation
statement: Choosing a Template on the Studio Scenes surface creates a Scene pre-populated from it and opens the Editor (AC-006 Template branch), proven in a browser by CHG-0058.
anchors:
  - path:studio/src/views/ScenesView.vue
  - path:studio/src/sceneTemplates.ts
  - path:server/tests/e2e/studioSceneTemplate.test.ts
  - path:.overlaykit/governance/changes/CHG-0058.json
requires:
  promises:
    - scene-templates-and-id-scoping
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: file-contains
        path: studio/src/views/ScenesView.vue
        matches: 'SCENE_TEMPLATES'
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0058.json
        matches: '"status": "implemented"'
