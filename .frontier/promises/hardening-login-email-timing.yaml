id: hardening-login-email-timing
statement: HARDENING (low) — login always runs a scrypt derivation (against a fixed decoy verifier when the email does not match the owner), so login timing cannot reveal the owner's email — is fixed by CHG-0075. The decoy uses the real scrypt parameters.
anchors:
  - path:server/src/auth/AuthService.ts
  - path:server/tests/unit/loginTiming.test.ts
  - path:.overlaykit/governance/changes/CHG-0075.json
requires:
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/tests/unit/loginTiming.test.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0075.json
        matches: '"status": "implemented"'
