id: hardening-ws-rate-limit
statement: "HARDENING (medium) — The /ws upgrade/connection path has no rate limit or connection cap (express-rate-limit covers /api only), so frame-bounding alone does not stop connection-flood DoS. Fix: add a per-IP upgrade throttle or connection cap on the wsServer upgrade."
anchors:
  - path:server/src/index.ts
requires:
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: hardening-ws-rate-limit-fixed
  command: "grep -qiE 'upgradeRateLimit|maxConnections|connectionCap|perIpUpgrade' server/src/index.ts"
