id: integrations-device-credential-audit
statement: A successor gives the owner a rotation and revocation audit trail on the Studio Integrations surface — who issued, rotated or revoked which credential and when. No audit persistence or view exists yet.
anchors:
  - path:studio/src/views/IntegrationsView.vue
  - path:server/src/routes/deviceCredentials.ts
requires:
  promises:
    - integrations-rotation-covered
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: integrations-shows-credential-audit
  command: "grep -qiE 'audit|history' studio/src/views/IntegrationsView.vue"
