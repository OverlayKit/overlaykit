id: hardening-production-idempotency-persisted
statement: "A successor makes browser take and preview-controls idempotency durable across process restart and beyond the bounded in-memory window (the model ADR-0030 requires for device commands), e.g. a persisted (show_id, operation_id) record. Deferred. Discovery 2026-08-25 confirmed the gap is real (mount() restores durable preview/program snapshots but newInternalState rebuilds empty operation maps, so a restart drops the op-id dedup) yet low severity — a retry carries the same operationId, hence the same intent, so the worst case is a spurious revision bump plus a duplicate production.taken broadcast, further guarded by the expectedPreviewRevision check, not a correctness violation. The human elected on 2026-08-25 to keep it deferred, judging it not worth a SqliteProductionStateStore schema migration plus a per-op write for a spurious-duplicate-on-restart-retry. The in-memory fingerprint idempotency from CHG-0077 covers the common in-process retry."
anchors:
  - path:server/src/services/ProductionService.ts
  - path:server/src/services/SqliteProductionStateStore.ts
requires:
  promises:
    - hardening-take-idempotency-durable
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: production-idempotency-persisted
  command: "grep -qiE 'operation_id.*UNIQUE|take_operations|persistOperationId' server/src/services/SqliteProductionStateStore.ts"
