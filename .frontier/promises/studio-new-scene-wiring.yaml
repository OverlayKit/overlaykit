id: studio-new-scene-wiring
statement: Choosing New Scene on the Studio Scenes surface creates a Scene in the Show and opens the Editor on it (AC-006 UI half), proven in a browser by CHG-0056.
anchors:
  - path:studio/src/views/ScenesView.vue
  - path:server/tests/e2e/studioNewScene.test.ts
  - path:.overlaykit/governance/changes/CHG-0056.json
requires:
  promises:
    - scene-create-endpoint-and-storage-unify
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: file-contains
        path: studio/src/views/ScenesView.vue
        matches: 'createScene'
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0056.json
        matches: '"status": "implemented"'
