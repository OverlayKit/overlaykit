id: companion-adapter-runtime-module
statement: "REQ-INT-002 — an installable Bitfocus Companion module: connection config (server URL and scoped device token), action callbacks that execute against the Control API, and packaging, verified against real controller behavior. Deferred: CHG-0079 proves headless catalog discovery; the runnable module and hardware verification are a later slice, still with no Elgato SDK in the core runtime."
anchors:
  - path:companion/src
requires:
  promises:
    - companion-catalog-visibility-discovery
    - companion-adapter-catalog-fetch
    - companion-adapter-command-request
    - companion-adapter-command-transport
    - companion-adapter-fetch-transport
    - companion-adapter-feedback
    - companion-adapter-feedback-transport
    - companion-adapter-facade
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: companion-adapter-runtime-module
  command: "grep -rqE 'executeAction|companion-module|InstanceBase|runEntrypoint' companion/src"
