id: companion-adapter-runtime-module
statement: "REQ-INT-002 — the thin @companion-module/base InstanceBase wrapper: it registers COMPANION_CONFIG_FIELDS and buildCompanionActionDefinitions from the SDK-free core, wires configFields/init/actions to createCompanionAdapter, supplies the run seam (operationId, expected revision, adapter), binds live feedbacks, and packages the module, verified against real controller behavior. Deferred: the SDK-free core is companion-adapter-module-core; this slice adds the @companion-module/base dependency (pending human approval) and needs hardware to fully verify."
anchors:
  - path:companion/src
requires:
  promises:
    - companion-catalog-visibility-discovery
    - companion-adapter-catalog-fetch
    - companion-adapter-command-request
    - companion-adapter-command-transport
    - companion-adapter-fetch-transport
    - companion-adapter-feedback
    - companion-adapter-feedback-transport
    - companion-adapter-facade
    - companion-adapter-module-core
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: companion-adapter-runtime-module
  command: "grep -q '@companion-module/base' companion/package.json"
