id: hardening-deescalation-subscription-teardown
statement: HARDENING (low) — the /ws residual hardening (deescalation-subscription-teardown) is fixed by CHG-0076 — a cookie-bearing upgrade with no Origin is rejected (a browser always sends Origin), and de-escalating to output tears down studio subscriptions. Output/OBS clients (no cookie) are unaffected.
anchors:
  - path:server/src/handlers/websocket.ts
  - path:server/tests/unit/outputSessionPrecedence.test.ts
  - path:.overlaykit/governance/changes/CHG-0076.json
requires:
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: file-contains
        ref: origin/main
        path: server/src/handlers/websocket.ts
        matches: 'HARDENED:deescalation-subscription-teardown'
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0076.json
        matches: '"status": "implemented"'
