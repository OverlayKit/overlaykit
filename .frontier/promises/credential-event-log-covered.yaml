id: credential-event-log-covered
statement: AC-016 (audit persistence) — device-credential issue, rotate and revoke append to a local append-only lifecycle event log carrying only metadata (credential, Show, kind, acting owner, generation, timestamp, sequence), owner-only and Show-scoped, ordered by a clock-independent sequence, tamper-resistant via append-only triggers — is proven by CHG-0065 under ADR-0041. Recording is best-effort after commit and the log is unsigned and local.
anchors:
  - path:server/src/auth/SqliteDeviceCredentialEventLog.ts
  - path:server/src/routes/deviceCredentials.ts
  - path:server/tests/unit/deviceCredentialEventLog.test.ts
  - path:.overlaykit/governance/changes/CHG-0065.json
requires:
  promises:
    - persisted-credential-event-log
    - integrations-audit-detail-covered
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/src/auth/SqliteDeviceCredentialEventLog.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0065.json
        matches: '"status": "implemented"'
