id: hardening-cookie-secure-default
statement: HARDENING (medium) — the session cookie fails safe to Secure in production (COOKIE_SECURE='auto' resolves to 'always'), so a misconfigured proxy can never downgrade it — is fixed by CHG-0070 per the owner's explicit policy choice; TRUST_PROXY is documented in .env.example. The fail-safe forces HTTPS in production (a plain-HTTP prod deploy will break logins).
anchors:
  - path:server/src/config/environment.ts
  - path:server/tests/unit/cookieSecure.test.ts
  - path:.overlaykit/governance/changes/CHG-0070.json
requires:
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/tests/unit/cookieSecure.test.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0070.json
        matches: '"status": "implemented"'
