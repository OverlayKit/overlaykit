anchors:
  - path:server/tests/e2e/studioProductionArc.test.ts
  - path:.overlaykit/governance/changes/CHG-0050.json
requires:
  promises:
    - studio-browser-harness
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
