id: scene-model-show-first-class
statement: A saved Scene carries a persisted monotonic revision (AC-007 revision clause), closed by CHG-0053. A Show-scoped create-Scene endpoint (AC-006) and the designer role on Send-to-Preview remain for later successors.
anchors:
  - path:server/src/storage/Storage.ts
  - path:server/tests/unit/sceneRevision.test.ts
  - path:.overlaykit/governance/changes/CHG-0053.json
requires:
  promises:
    - studio-send-to-preview-covered
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: file-contains
        path: server/src/storage/Storage.ts
        matches: 'revision'
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0053.json
        matches: '"status": "implemented"'
