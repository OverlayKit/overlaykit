id: scene-create-and-designer-role
statement: The designer role (AC-008 actor) may Send a Scene to Preview while Take stays producer-level, closed by CHG-0054.
anchors:
  - path:server/src/index.ts
  - path:server/tests/unit/previewRoleGate.test.ts
  - path:.overlaykit/governance/changes/CHG-0054.json
requires:
  promises:
    - scene-model-show-first-class
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: command-succeeds
        name: preview-mount-admits-designer
        command: "grep -qE \"requireAnyRole\\(\\['owner', 'producer', 'designer'\" server/src/index.ts"
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0054.json
        matches: '"status": "implemented"'
