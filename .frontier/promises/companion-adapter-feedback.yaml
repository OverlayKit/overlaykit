id: companion-adapter-feedback
statement: "REQ-INT-002 / AC-018 feedback half — the Companion adapter receives live state feedback from the Control API so a button reflects Studio or other-device changes. The command half is companion-adapter-command-request. Deferred: requires a signed WebSocket bootstrap and delta client (or an HTTP feedback endpoint) beyond the CHG-0079 and CHG-0080 headless catalog and command projections."
anchors:
  - path:companion/src
requires:
  promises:
    - companion-catalog-visibility-discovery
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: companion-adapter-feedback
  command: "grep -rqE 'feedback|device\\.state\\.delta' companion/src"
