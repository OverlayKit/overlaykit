id: scene-templates-and-id-scoping
statement: The created Scene id is Show-scoped so same-named Scenes across Shows never collide (closed by CHG-0057).
anchors:
  - path:server/src/routes/collections.ts
  - path:server/tests/unit/sceneIdScoping.test.ts
  - path:.overlaykit/governance/changes/CHG-0057.json
requires:
  promises:
    - studio-new-scene-wiring
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: file-contains
        path: server/src/routes/collections.ts
        matches: 'slug(showId)'
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0057.json
        matches: '"status": "implemented"'
