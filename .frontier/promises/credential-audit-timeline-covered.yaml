id: credential-audit-timeline-covered
statement: AC-016 (audit UI) — the Studio Integrations surface renders the server's append-only device-credential lifecycle event log as an activity timeline (issued, rotated, revoked in recorded order) — is proven by CHG-0066. This completes the device-credential lifecycle line (issue, list, rotate, revoke, derived summary, persisted event log, timeline). Filtering, pagination and export stay unbuilt and undeclared until a need is shown.
anchors:
  - path:studio/src/views/IntegrationsView.vue
  - path:server/tests/e2e/studioIntegrations.test.ts
  - path:.overlaykit/governance/changes/CHG-0066.json
requires:
  promises:
    - integrations-credential-audit-timeline
    - credential-event-log-covered
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/tests/e2e/studioIntegrations.test.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0066.json
        matches: '"status": "implemented"'
