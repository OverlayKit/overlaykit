id: hardening-studio-ws-session-revocation
statement: HARDENING (medium) — a Studio /ws socket is revoked (closed 1008) on its next frame after logout or session TTL expiry, so the authority captured at upgrade no longer outlives the session — is fixed by CHG-0069 via per-frame session re-validation. Revocation is on next action, not for a passive idle socket (which cannot act).
anchors:
  - path:server/src/handlers/websocket.ts
  - path:server/tests/unit/studioWebSocketRevocation.test.ts
  - path:.overlaykit/governance/changes/CHG-0069.json
requires:
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/tests/unit/studioWebSocketRevocation.test.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0069.json
        matches: '"status": "implemented"'
