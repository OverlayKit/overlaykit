id: persisted-credential-event-log
statement: A successor persists a per-event device-credential lifecycle log (issued, rotated, revoked events with a per-event timestamp and actor), because the derived summary from CHG-0064 cannot reconstruct per-rotation history. This is an architectural decision — a new persisted source of truth — and needs its own ADR before implementation.
anchors:
  - path:server/src/auth/SqliteDeviceCredentialStore.ts
  - path:protocol/src/device-credential.ts
requires:
  promises:
    - integrations-audit-detail-covered
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: credential-event-log-persisted
  command: "grep -qiE 'credential_events|CredentialEvent|lifecycle_events' server/src/auth/SqliteDeviceCredentialStore.ts"
