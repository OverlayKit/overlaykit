id: integrations-credential-audit-timeline
statement: A successor surfaces the persisted device-credential lifecycle event log (CHG-0065) as a per-credential or per-Show timeline on the Studio Integrations surface, so the owner reads the issue, rotate and revoke history the server records. The events route exists; the UI timeline does not.
anchors:
  - path:studio/src/views/IntegrationsView.vue
  - path:server/src/routes/deviceCredentials.ts
requires:
  promises:
    - credential-event-log-covered
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: integrations-shows-event-timeline
  command: "grep -qiE 'device-credentials/[^ ]*events|event-log|timeline' studio/src/views/IntegrationsView.vue"
