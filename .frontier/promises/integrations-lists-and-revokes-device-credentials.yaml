id: integrations-lists-and-revokes-device-credentials
statement: AC-016's manage half — the owner lists issued device credentials as Show-scoped metadata (no secret material) and revokes one from the Studio Integrations surface — is proven by CHG-0062. It does not re-prove revocation enforcement, which stays at the integration tier.
anchors:
  - path:studio/src/views/IntegrationsView.vue
  - path:server/src/routes/deviceCredentials.ts
  - path:server/tests/e2e/studioIntegrations.test.ts
  - path:.overlaykit/governance/changes/CHG-0062.json
requires:
  promises:
    - integrations-manage-device-credentials
    - integrations-ui-issues-scoped-token
  conditions: []
fulfilled_when:
  all_of:
    subject:
      ref: null
    clauses:
      - type: path-exists
        path: server/tests/e2e/studioIntegrations.test.ts
      - type: file-contains
        ref: origin/main
        path: .overlaykit/governance/changes/CHG-0062.json
        matches: '"status": "implemented"'
