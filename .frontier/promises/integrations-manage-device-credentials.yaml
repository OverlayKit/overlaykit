id: integrations-manage-device-credentials
statement: A successor lets the owner list, rotate and revoke issued device credentials from the Studio Integrations UI. This needs a GET list route for issued credentials, which does not exist yet.
anchors:
  - path:studio/src/views/IntegrationsView.vue
  - path:server/src/routes/deviceCredentials.ts
requires:
  promises:
    - integrations-ui-issues-scoped-token
  conditions: []
fulfilled_when:
  type: command-succeeds
  name: integrations-lists-and-manages-credentials
  command: "grep -qE 'router\\.get\\(.+device-credentials' server/src/routes/deviceCredentials.ts && grep -qiE 'rotate|revoke' studio/src/views/IntegrationsView.vue"
