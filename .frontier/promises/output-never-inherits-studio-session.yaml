id: output-never-inherits-studio-session
statement: A bounded change proves that an Output page connection never inherits an interactive Studio session on the /ws upgrade (the deferred unknown from CHG-0046).
anchors:
  - path:server/src/handlers/websocket.ts
  - path:.overlaykit/governance/decisions/ADR-0039.json
  - path:.overlaykit/governance/changes/CHG-0048.json
requires:
  promises:
    - chg-0047-implemented-on-main
  conditions: []
fulfilled_when:
  type: file-contains
  ref: origin/main
  path: .overlaykit/governance/changes/CHG-0048.json
  matches: '"status": "implemented"'
